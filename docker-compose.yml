services:
  gateway:
    build: ./gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - GATEWAY_PORT=8080
      - MONITOR_URL=http://monitor:8081
      - DASHBOARD_URL=http://dashboard:8082
    depends_on:
      monitor:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  monitor:
    build: ./monitor
    ports:
      - "${MONITOR_PORT:-8081}:8081"
    environment:
      - MONITOR_PORT=8081
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  dashboard:
    build: ./dashboard
    ports:
      - "${DASHBOARD_PORT:-8082}:8082"
    environment:
      - DASHBOARD_PORT=8082
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
